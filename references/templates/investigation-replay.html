<title>調查重播</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: 調查重播 — 上方播放控制與時間軸，左側是「這一步做了什麼」，右側是隨步驟長出來的調查板 */
:root{
  --bg:#eef1f3; --surface:#ffffff; --ink:#17212b; --muted:#5d6b78; --line:#d3dae0;
  --act:#47566a; --judge:#1f5fbf; --infer:#7b3fb5; --persist:#1e7a4a; --quit:#b3361f;
  --act-soft:#e6eaef; --judge-soft:#e3ecfa; --infer-soft:#efe6f8; --persist-soft:#e1f2e8; --quit-soft:#f9e6e2;
  --hl:#f2c94c;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --ink:#e4eaf0; --muted:#97a6b4; --line:#2a3642;
  --act:#a9b6c6; --judge:#7fb0ff; --infer:#c79bf2; --persist:#6fd39c; --quit:#f2917d;
  --act-soft:#222c37; --judge-soft:#18283f; --infer-soft:#291d38; --persist-soft:#16301f; --quit-soft:#3a1f1a;
  --hl:#d9b13a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --ink:#e4eaf0; --muted:#97a6b4; --line:#2a3642;
  --act:#a9b6c6; --judge:#7fb0ff; --infer:#c79bf2; --persist:#6fd39c; --quit:#f2917d;
  --act-soft:#222c37; --judge-soft:#18283f; --infer-soft:#291d38; --persist-soft:#16301f; --quit-soft:#3a1f1a;
  --hl:#d9b13a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;padding-inline:18px;padding-block:18px 28px}
.app{max-width:1280px;margin:0 auto;display:grid;gap:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* 標題列 */
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 20px}
h1{margin:0;font-size:clamp(22px,3vw,30px);font-weight:900;text-wrap:balance}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.counters{display:flex;flex-wrap:wrap;gap:8px}
.ctr{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid;line-height:1.2;min-width:84px}
.ctr b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.ctr span{font-size:11.5px;color:var(--muted)}
.ctr.bump b{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25);color:var(--judge)}100%{transform:scale(1)}}

/* 控制與時間軸 */
.controls{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:10px}
.btns{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btns button{font-family:var(--f-body);font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.btns button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);min-width:88px}
.btns button:focus-visible,.tick:focus-visible{outline:2px solid var(--judge);outline-offset:2px}
.btns .spd[aria-pressed="true"]{background:var(--judge-soft);border-color:var(--judge);color:var(--judge)}
.pos{margin-left:auto;font-size:13px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.track{display:grid;gap:4px}
.phases{display:flex;gap:3px;font-size:11.5px;color:var(--muted)}
.phases div{border-top:2px solid var(--line);padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.phases div.on{border-color:var(--ink);color:var(--ink);font-weight:700}
.ticks{display:flex;gap:3px}
.tick{flex:1;height:22px;border-radius:4px;border:0;cursor:pointer;opacity:.35;padding:0;min-width:0}
.tick.done{opacity:.85}.tick.cur{opacity:1;box-shadow:0 0 0 2px var(--ink)}
.k-act{background:var(--act)}.k-judge{background:var(--judge)}.k-infer{background:var(--infer)}.k-persist{background:var(--persist)}.k-quit{background:var(--quit)}

/* 主區 */
.main{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:14px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:12px;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
@media (max-width:900px){.step{position:static}}
.step .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.num{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.kind{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px}
.kind.act{background:var(--act-soft);color:var(--act)}.kind.judge{background:var(--judge-soft);color:var(--judge)}
.kind.infer{background:var(--infer-soft);color:var(--infer)}.kind.persist{background:var(--persist-soft);color:var(--persist)}.kind.quit{background:var(--quit-soft);color:var(--quit)}
.step h2{margin:0;font-size:19px;line-height:1.4;text-wrap:balance}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tool{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.row{display:grid;gap:3px}
.row .lab{font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.row p{margin:0;font-size:14.5px}
.row.why{border-left:3px solid var(--judge);padding-left:10px}
.step.enter{animation:enter .45s ease}
@keyframes enter{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 調查板 */
.board{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;min-width:0}
.board-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.board-h h3{margin:0;font-size:15px}
.board-h small{color:var(--muted);font-size:12.5px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.cols{grid-template-columns:1fr}}
.col{background:var(--bg);border-radius:10px;padding:8px;display:grid;gap:6px;align-content:start;min-height:120px;min-width:0}
.col h4{margin:0 0 2px;font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;line-height:1.45;display:flex;gap:7px;align-items:flex-start;min-width:0}
.card .lv{flex:none;font-size:13px;width:18px;text-align:center}
.card .tx{min-width:0;overflow-wrap:anywhere}
.card.new{animation:pop .6s ease}
.card.hl{box-shadow:0 0 0 2px var(--hl);background:color-mix(in srgb,var(--hl) 16%,var(--surface))}
.card.gone{opacity:.0}
.card.gap{border-style:dashed}
@keyframes pop{0%{opacity:0;transform:scale(.85) translateY(-6px)}60%{opacity:1;transform:scale(1.04)}100%{transform:none}}
.empty{font-size:12px;color:var(--muted);opacity:.7}
.lvkey{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.card.new,.step.enter,.ctr.bump b{animation:none}}
</style>
<div class="app">
  <div class="top">
    <div>
      <h1 id="h-title">調查重播</h1>
      <p class="sub" id="h-sub"></p>
    </div>
    <div class="counters" id="counters" aria-live="polite"></div>
  </div>

  <div class="controls">
    <div class="btns">
      <button type="button" id="b-play" class="primary">▶ 播放</button>
      <button type="button" id="b-prev" aria-label="上一步">◀ 上一步</button>
      <button type="button" id="b-next" aria-label="下一步">下一步 ▶</button>
      <button type="button" id="b-restart">從頭</button>
      <button type="button" class="spd" data-s="1" aria-pressed="true">1×</button>
      <button type="button" class="spd" data-s="2" aria-pressed="false">2×</button>
      <span class="pos mono" id="pos"></span>
    </div>
    <div class="legend">
      <span><i class="k-act"></i>行動</span><span><i class="k-judge"></i>判斷</span><span><i class="k-infer"></i>推論</span><span><i class="k-persist"></i>堅持</span><span><i class="k-quit"></i>放棄</span>
      <span>鍵盤：空白鍵播放、← → 換步</span>
    </div>
    <div class="track">
      <div class="phases" id="phases"></div>
      <div class="ticks" id="ticks" role="group" aria-label="跳到某一步"></div>
    </div>
  </div>

  <div class="main">
    <article class="step" id="step" aria-live="polite"></article>
    <section class="board" aria-label="調查板">
      <div class="board-h">
        <h3>調查板：到這一步為止知道了什麼</h3>
        <div class="lvkey"><span>✅ 已確認</span><span>◐ 單一來源</span><span>📣 公司自己說</span><span>？ 推測</span><span>✕ 查不到</span><span>🛑 被攔下的錯</span></div>
      </div>
      <div class="cols" id="cols"></div>
    </section>
  </div>
</div>

<script>
/* 調查重播範本（Enterprise Tomb Raider）
 * 畫面與資料分離：本檔不要手改步驟內容。
 * 每案的資料來自 cases/{目標}/replay-log.jsonl，由 scripts/build-replay.py 注入下一行。 */
const DATA = /*__REPLAY_DATA__*/null;

const DEFAULT_COLS=[["id","身分與經營者"],["story","故事、客戶、產業"],["money","錢"],["rep","員工評價"],["risk","風險與訴訟"],["gap","查不到・被攔下"]];
const DEFAULT_COUNTERS=[["ws","網路搜尋"],["web","網頁抓取"],["pdf","PDF 下載"],["mcp","MCP 呼叫"],["agent","subagent"]];
const KIND={act:"行動",judge:"判斷",infer:"推論",persist:"堅持",quit:"放棄"};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

if(!DATA){
  $("#h-sub").textContent="這是空白範本。用 scripts/build-replay.py 把某一案的 replay-log.jsonl 注入後才會有內容。";
}else{
const M=DATA.meta, STEPS=DATA.steps, N=STEPS.length;
const PHASES=M.phases, COLS=M.cols||DEFAULT_COLS;
const TOT=STEPS.reduce((t,s)=>{for(const k in (s.d||{}))t[k]=(t[k]||0)+s.d[k];return t},{});
const COUNTERS=(M.counters||DEFAULT_COUNTERS).filter(([k])=>TOT[k]);
document.title=M.title||document.title;
$("#h-title").textContent=M.title;
$("#h-sub").textContent=M.subtitle||"";
const cEl=$("#counters");
COUNTERS.concat([["cards","板上線索"]]).forEach(([k,label])=>{const d=document.createElement("div");d.className="ctr";d.id="c-"+k;d.innerHTML=`<b>0</b><span>${esc(label)}${k==="cards"?"":" / "+TOT[k]}</span>`;cEl.appendChild(d)});

const ticks=$("#ticks"),phasesEl=$("#phases"),colsEl=$("#cols"),stepEl=$("#step");
const colEls={};
COLS.forEach(([k,name])=>{const c=document.createElement("div");c.className="col";c.innerHTML=`<h4>${esc(name)}</h4><div class="empty">尚無線索</div>`;colsEl.appendChild(c);colEls[k]=c});
STEPS.forEach((s,i)=>{const b=document.createElement("button");b.type="button";b.className="tick k-"+s.k;b.title=`${i+1}. ${KIND[s.k]}：${s.t}`;b.setAttribute("aria-label",b.title);b.onclick=()=>{stop();go(i)};ticks.appendChild(b)});
PHASES.forEach(([k,name])=>{const n=STEPS.filter(s=>s.ph===k).length;if(!n)return;const d=document.createElement("div");d.style.flex=n;d.dataset.ph=k;d.textContent=name;phasesEl.appendChild(d)});

function stateAt(idx){
  const cards=new Map();const tot={};
  for(let i=0;i<=idx;i++){const s=STEPS[i];
    (s.add||[]).forEach(([id,col,lv,tx])=>cards.set(id,{col,lv,tx,step:i}));
    (s.upd||[]).forEach(([id,lv,tx])=>{const c=cards.get(id);if(c){c.lv=lv;c.tx=tx;c.upd=i}});
    for(const k in (s.d||{}))tot[k]=(tot[k]||0)+s.d[k];}
  return{cards,tot};
}
let cur=-1;
function go(idx){
  idx=Math.max(0,Math.min(N-1,idx));cur=idx;
  const s=STEPS[idx];const {cards,tot}=stateAt(idx);
  const ph=PHASES.find(p=>p[0]===s.ph);
  stepEl.classList.remove("enter");void stepEl.offsetWidth;stepEl.classList.add("enter");
  const tools=(s.tools||[]).length?s.tools.map(t=>`<span class="tool">${esc(t)}</span>`).join(""):`<span class="tool">不用工具，純判斷</span>`;
  stepEl.innerHTML=`<div class="head"><span class="num">第 ${idx+1} 步 · ${esc(ph?ph[1]:s.ph)}</span><span class="kind ${s.k}">${KIND[s.k]}</span></div>
  <h2>${esc(s.t)}</h2><div class="tools">${tools}</div>
  <div class="row"><span class="lab">做了什麼</span><p>${esc(s.did)}</p></div>
  <div class="row"><span class="lab">得到什麼</span><p>${esc(s.got)}</p></div>
  <div class="row why"><span class="lab">為什麼這樣做</span><p>${esc(s.why)}</p></div>`;
  const hl=new Set(s.hl||[]);
  document.querySelectorAll(".card").forEach(el=>{if(!cards.has(el.dataset.id))el.remove()});
  COLS.forEach(([k])=>{colEls[k].querySelector(".empty").hidden=[...cards.values()].some(c=>c.col===k)});
  [...cards].forEach(([id,c])=>{
    const col=colEls[c.col]||colEls[COLS[COLS.length-1][0]];
    let el=colsEl.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
    if(!el){el=document.createElement("div");el.className="card";el.dataset.id=id;col.appendChild(el)}
    el.innerHTML=`<span class="lv">${esc(c.lv)}</span><span class="tx">${esc(c.tx)}</span>`;
    el.classList.toggle("gap",c.col==="gap");
    el.classList.remove("new","hl");void el.offsetWidth;
    if(c.step===idx||c.upd===idx)el.classList.add("new");
    if(hl.has(id))el.classList.add("hl");
  });
  const set=(k,v)=>{const e=$("#c-"+k);if(!e)return;const b=e.querySelector("b");if(b.textContent!==String(v)){b.textContent=v;e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}};
  COUNTERS.forEach(([k])=>set(k,tot[k]||0));set("cards",cards.size);
  [...ticks.children].forEach((t,i)=>{t.classList.toggle("done",i<idx);t.classList.toggle("cur",i===idx)});
  [...phasesEl.children].forEach(d=>d.classList.toggle("on",d.dataset.ph===s.ph));
  $("#pos").textContent=`${idx+1} / ${N}`;
}
let timer=null,speed=1;
const DUR=()=>Math.round(5200/speed);
function play(){if(cur>=N-1)go(0);timer=setInterval(()=>{if(cur>=N-1){stop();return}go(cur+1)},DUR());$("#b-play").textContent="❚❚ 暫停"}
function stop(){clearInterval(timer);timer=null;$("#b-play").textContent="▶ 播放"}
$("#b-play").onclick=()=>timer?stop():play();
$("#b-prev").onclick=()=>{stop();go(cur-1)};
$("#b-next").onclick=()=>{stop();go(cur+1)};
$("#b-restart").onclick=()=>{stop();go(0);play()};
document.querySelectorAll(".spd").forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll(".spd").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));if(timer){stop();play()}});
document.addEventListener("keydown",e=>{if(e.target.closest("button")&&e.key===" ")return;
  if(e.key===" "){e.preventDefault();timer?stop():play()}
  else if(e.key==="ArrowRight"){stop();go(cur+1)}else if(e.key==="ArrowLeft"){stop();go(cur-1)}});
if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){go(N-1)}else{go(0);play()}
}
</script>
